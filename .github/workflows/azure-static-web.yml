name: Deploy Web to Azure Static Web Apps

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install web dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build web (Vite)
        run: |
          cd apps/web
          npm run build

      - name: Upload artifact and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} # required
          repo_token: ${{ secrets.GITHUB_TOKEN }} # optional, used for PR comments
          action: "upload"
          app_location: "apps/web" # path to the app to build (root of the web project)
          api_location: "" # no API in this project
          output_location: "apps/web/dist" # built output folder

# Notes:
# - Create the secret AZURE_STATIC_WEB_APPS_API_TOKEN in the repo settings.
# - Configure the Azure Static Web App in the Azure Portal and obtain the token.
# - Adjust paths above if your web app build output differs.
